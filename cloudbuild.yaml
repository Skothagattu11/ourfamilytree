# Auto-deploy: Cloud Build trigger "deploy-family-tree" (us-central1) runs this on every push to main.
# Builds the container, pushes it to Artifact Registry and rolls it out to Cloud Run.
# The service keeps its runtime settings (service account, env vars, timeout) from ./deploy.sh.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}:${SHORT_SHA}', '-t', '${_IMAGE}:latest', '.']

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_IMAGE}']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ['run', 'deploy', '${_SERVICE}', '--image', '${_IMAGE}:${SHORT_SHA}', '--region', '${_REGION}', '--quiet']

substitutions:
  _REGION: us-central1
  _SERVICE: family-tree
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/family-tree

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
