<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Tree</title>
<style>
:root{
  --bg:#fbf7f0; --panel:#ffffff; --ink:#2b2420; --muted:#7a6f66; --line:#e9e1d6;
  --band:rgba(120,90,60,.045); --accent:#e0703a; --accent-ink:#fff;
  --shadow:0 10px 30px rgba(60,40,20,.14); --card-shadow:rgba(60,40,20,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1714; --panel:#262220; --ink:#f3ece4; --muted:#a99d91; --line:#3a332e;
    --band:rgba(255,240,220,.035); --shadow:0 10px 30px rgba(0,0,0,.45); --card-shadow:rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1714; --panel:#262220; --ink:#f3ece4; --muted:#a99d91; --line:#3a332e;
  --band:rgba(255,240,220,.035); --shadow:0 10px 30px rgba(0,0,0,.45); --card-shadow:rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;height:100dvh;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
#fab{display:none}
.grab{display:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}

/* header */
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:5}
.logo{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.logo span{font-size:22px}
.tabs{display:flex;background:var(--bg);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:650;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.search{position:relative;flex:1;min-width:150px;max-width:340px;margin-left:auto}
.search input{border-radius:999px;padding:8px 14px 8px 34px}
.search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:20}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px}
.results button:hover,.results button.on{background:var(--bg)}
.results small{color:var(--muted);margin-left:auto}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:650;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.icon{padding:8px 11px}
.menu{position:absolute;right:16px;top:58px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:30;min-width:220px}
.menu button,.menu label{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer}
.menu button:hover,.menu label:hover{background:var(--bg)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

main{flex:1;position:relative;overflow:hidden}

/* families view */
#familiesView{position:absolute;inset:0;overflow:auto;padding:16px 16px 40px}
.wrap{max-width:1100px;margin:0 auto}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.hero h1{margin:0;font-size:26px;letter-spacing:-.02em}
.stats{color:var(--muted);margin-top:2px}
.constellation{background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden;position:relative}
.constellation svg{display:block;width:100%}
.constellation .hint{position:absolute;left:16px;top:12px;color:var(--muted);font-size:13px}
.bubble{cursor:pointer}
.bubble .float{animation:bob 6s ease-in-out infinite}
.bubble .grow{transition:transform .25s cubic-bezier(.2,.8,.3,1.4);transform-box:fill-box;transform-origin:center}
.bubble:hover .grow{transform:scale(1.07)}
.bubble .main{stroke-width:3}
.bubble text{text-anchor:middle;fill:var(--ink)}
.bubble .fname{font-weight:800}
.bubble .fcount{fill:var(--muted);font-size:12px}
.flink{stroke:var(--muted);opacity:.35;stroke-linecap:round}
.ring{font-size:14px;text-anchor:middle}
@keyframes bob{50%{transform:translateY(-7px)}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:16px}
.fcard{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s}
.fcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.fcard h3{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.fcard h3 .cnt{margin-left:auto;font-size:13px;font-weight:700;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink);padding:2px 9px;border-radius:999px}
.fcard .avs{font-size:22px;letter-spacing:2px;min-height:30px}
.fcard .meta{color:var(--muted);font-size:13px}
.fcard .cact{display:flex;gap:8px;margin-top:6px}
.fcard .cact .btn{padding:6px 12px;font-size:13px}
.empty{text-align:center;padding:70px 16px;max-width:520px;margin:0 auto}
.empty .big{font-size:64px}
.empty h1{margin:10px 0 6px}
.empty p{color:var(--muted)}

/* tree view */
#treeView{position:absolute;inset:0;display:flex;flex-direction:column}
.chipsbar{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;align-items:center;border-bottom:1px solid var(--line);background:var(--panel);scrollbar-width:thin}
.chipsbar .lbl{color:var(--muted);font-size:13px;white-space:nowrap}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px 5px 8px;font-weight:650;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;opacity:.55;transition:opacity .15s,border-color .15s}
.chip .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.chip.on{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--panel))}
.chip.all{opacity:1;padding-left:12px}
.treewrap{flex:1;position:relative;overflow:hidden}
#tree{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#tree.dragging{cursor:grabbing}
.tools{position:absolute;left:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap}
.tools .btn{box-shadow:0 4px 14px var(--card-shadow)}
.pathpill{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 14px;font-weight:650;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.pathpill button{border:0;background:none;color:inherit;font-weight:800}
.treeempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:16px}

.node{cursor:pointer}
.node .shadow{fill:var(--card-shadow)}
.node .card{fill:var(--panel);stroke:var(--c);stroke-width:2}
.node.in .card{stroke-dasharray:6 4}
.node.sel .card{stroke-width:4}
.node.sel{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c) 60%,transparent))}
.node .nm{font-weight:750;font-size:14.5px;fill:var(--ink)}
.node .sb{font-size:12px;fill:var(--muted)}
.node .emo{font-size:25px;text-anchor:middle;dominant-baseline:central}
.node .jump rect{opacity:.95}
.node .jump text{fill:#fff;font-size:11px;font-weight:800;text-anchor:middle}
.node .jump:hover rect{opacity:1}
.node .tog circle{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}
.node .tog text{font-size:12px;font-weight:800;text-anchor:middle;fill:var(--ink)}
.node .tog:hover circle{stroke:var(--accent)}
.node.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.3)}
@keyframes pop{from{opacity:0}to{opacity:1}}
.link{fill:none;stroke-width:2.2;opacity:.55;stroke-linecap:round}
.couple{stroke:var(--accent);stroke-width:2.5;opacity:.8}
.heart{fill:var(--accent);font-size:14px;text-anchor:middle}
.bandrect{fill:var(--band)}
.bandlbl{fill:var(--muted);font-size:13px;font-weight:700;opacity:.8}
#tree .node,#tree .link,#tree .couple,#tree .heart{transition:opacity .2s}
#tree.hl .node:not(.lit){opacity:.22}
#tree.hl .link:not(.lit),#tree.hl .couple:not(.lit),#tree.hl .heart{opacity:.08}
#tree.hl .link.lit{opacity:1;stroke-width:3.5}
#tree.hl .couple.lit{opacity:1}

/* side panel */
#panel{position:absolute;right:12px;top:12px;bottom:12px;width:350px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);transform:translateX(115%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow:auto;z-index:10;padding:18px}
#panel.open{transform:none}
.pclose{position:absolute;right:12px;top:12px;border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:16px}
.phead{text-align:center;padding-top:4px}
.bigav{width:84px;height:84px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:46px;background:color-mix(in srgb,var(--c) 18%,transparent);border:3px solid var(--c)}
.phead h2{margin:0;font-size:22px}
.phead .yrs{color:var(--muted);margin:2px 0 8px}
.famchip{border:0;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--c) 16%,transparent)}
.notes{background:var(--bg);border-radius:14px;padding:10px 12px;margin:12px 0 0;white-space:pre-wrap}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 6px}
.quick button{border:1.5px dashed var(--line);background:none;border-radius:14px;padding:10px 8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.quick button span{font-size:22px}
.quick button:hover{border-color:var(--accent);border-style:solid;background:color-mix(in srgb,var(--accent) 7%,transparent)}
.rel h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1.5px solid color-mix(in srgb,var(--c) 50%,var(--line));background:var(--panel);border-radius:999px;padding:4px 10px 4px 6px;font-size:13px;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.pchip:hover{background:color-mix(in srgb,var(--c) 12%,var(--panel))}
.prow{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.prow .btn{font-size:13px;padding:7px 12px}
.btn.danger{color:#c43c3c}
.btn.danger.armed{background:#c43c3c;color:#fff;border-color:#c43c3c}

/* dialogs */
dialog{border:0;border-radius:24px;padding:0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);width:min(460px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(30,20,10,.4);backdrop-filter:blur(2px)}
dialog form,.dpad{padding:20px;display:flex;flex-direction:column;gap:12px}
dialog h3{margin:0;font-size:20px}
.ctx{margin:-6px 0 0;color:var(--muted);font-size:14px}
dialog label{display:flex;flex-direction:column;gap:5px;font-weight:650;font-size:13px}
.hint{font-weight:400;color:var(--muted);font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px}
.seg label{flex:1;flex-direction:row;justify-content:center;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:9px 6px;cursor:pointer;font-size:14px}
.seg input{display:none}
.seg label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
details summary{cursor:pointer;color:var(--muted);font-weight:650;font-size:13px}
.emojis{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.emojis button{border:1.5px solid transparent;background:var(--bg);border-radius:10px;font-size:22px;width:40px;height:40px;padding:0}
.emojis button.on{border-color:var(--accent)}
.emojis button.auto{font-size:11px;font-weight:700;width:auto;padding:0 10px}
.dact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.flash{color:#2f9a5b;font-weight:700;font-size:13px;min-height:18px}
.relbig{font-size:20px;line-height:1.35;background:var(--bg);border-radius:16px;padding:14px 16px;text-align:center}
.relbig em{font-style:normal;color:var(--accent);font-weight:800}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-size:13px}
.chain i{color:var(--muted);font-style:normal}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:650;transition:.3s;z-index:100;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;pointer-events:none;font-size:22px;z-index:99}

@media (max-width:700px){
  header{padding:calc(8px + env(safe-area-inset-top)) 12px 8px;gap:8px}
  .logo{font-size:16px}
  .tabs{margin-left:auto}
  .tabs button{padding:8px 12px;font-size:14px}
  .search{order:5;max-width:none;flex-basis:100%;margin-left:0}
  .search input{padding:10px 14px 10px 36px}
  #addBtn{display:none}
  .menu{right:12px;left:12px;top:auto;margin-top:6px}
  #familiesView{padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
  .hero h1{font-size:22px}
  .hero .btn{width:100%;justify-content:center;padding:12px}
  .constellation{border-radius:20px}
  .constellation .hint{font-size:12px;left:12px;right:12px}
  .cards{grid-template-columns:1fr;gap:10px}
  .fcard .cact .btn{flex:1;justify-content:center;padding:10px}
  .chipsbar{padding:8px 12px}
  .chip{padding:7px 12px 7px 9px}

  /* person sheet */
  #panel{left:0;right:0;bottom:0;top:auto;width:auto;max-height:55dvh;border-radius:24px 24px 0 0;transform:translateY(105%);padding:6px 16px calc(16px + env(safe-area-inset-bottom));border-left:0;border-right:0;border-bottom:0}
  .grab{display:block;width:100%;height:26px;border:0;background:none;position:relative;touch-action:none}
  .grab::after{content:"";position:absolute;left:50%;top:10px;width:44px;height:5px;border-radius:3px;background:var(--line);transform:translateX(-50%)}
  .pclose{top:16px}
  .phead{display:grid;grid-template-columns:64px 1fr;column-gap:12px;text-align:left;align-items:center;padding-right:36px}
  .phead .bigav{width:64px;height:64px;font-size:34px;margin:0;grid-row:span 3}
  .phead h2{font-size:19px}
  .phead .yrs{margin:0 0 4px}
  .phead .famchip{justify-self:start}
  .quick{grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
  .quick button{padding:10px 2px;font-size:12px;border-radius:12px}
  .prow .btn{flex:1;justify-content:center;padding:10px 8px}
  .pchip{padding:7px 12px 7px 8px}

  /* dialogs become bottom sheets */
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:24px 24px 0 0;max-height:92dvh}
  dialog form,.dpad{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .dact{position:sticky;bottom:0;background:var(--panel);padding:10px 0 4px;margin-bottom:-4px}
  .dact .btn{flex:1;justify-content:center;padding:12px 10px}
  .dact .btn[value=cancel]{flex:0 0 auto}

  .tools{left:12px;bottom:calc(12px + env(safe-area-inset-bottom))}
  .tools .btn{padding:10px 13px}
  .btn .t{display:none}
  #fab{display:flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(224,112,58,.45);z-index:8;transition:transform .2s}
  #fab:active{transform:scale(.92)}
  body.sheet-open #fab,body.sheet-open .tools{opacity:0;pointer-events:none}
  .pathpill{top:10px;max-width:calc(100vw - 24px);font-size:12px}
  #toast{bottom:calc(90px + env(safe-area-inset-bottom))}
}
@media (hover:none){ .fcard:hover{transform:none;box-shadow:none} .bubble:hover .grow{transform:none} }
@media (prefers-reduced-motion: reduce){ .bubble .float{animation:none} *{transition-duration:.01ms!important} }
</style>
</head>
<body>
<header>
  <div class="logo"><span>🌳</span>Family Tree</div>
  <div class="tabs" role="tablist">
    <button id="tabFam" role="tab">Families</button>
    <button id="tabTree" role="tab">Whole tree</button>
  </div>
  <div class="search">
    <input id="q" placeholder="Find someone…  ( / )" autocomplete="off">
    <div class="results" id="results" hidden></div>
  </div>
  <button class="btn primary" id="addBtn" title="Add a person (N)">＋ <span class="t">Add person</span></button>
  <button class="btn icon" id="menuBtn" title="More">⋯</button>
  <div class="menu" id="menu" hidden>
    <button data-m="rel">🔗 How are two people related?</button>
    <hr>
    <button data-m="export">⬇️ Save a backup (.json)</button>
    <label>⬆️ Load a backup…<input type="file" id="importFile" accept=".json,application/json" hidden></label>
    <hr>
    <button data-m="sample">🧪 Load example families</button>
    <button data-m="blank" id="blankBtn">🧹 Start a blank tree</button>
  </div>
</header>

<main>
  <section id="familiesView"></section>

  <section id="treeView" hidden>
    <div class="chipsbar" id="chips"></div>
    <div class="treewrap">
      <svg id="tree">
        <g id="vp"><g id="bands"></g><g id="links"></g><g id="nodes"></g></g>
      </svg>
      <div class="treeempty" id="treeEmpty" hidden></div>
      <div class="pathpill" id="pathPill" hidden><span id="pathTxt"></span><button id="pathClear" title="Clear">✕</button></div>
      <div class="tools">
        <button class="btn icon" id="zIn" title="Zoom in">＋</button>
        <button class="btn icon" id="zOut" title="Zoom out">－</button>
        <button class="btn" id="zFit" title="Fit everything">⤢ <span class="t">Fit</span></button>
        <button class="btn" id="relBtn">🔗 <span class="t">How related?</span></button>
      </div>
    </div>
  </section>

  <aside id="panel" aria-live="polite"></aside>
  <button id="fab" aria-label="Add a person">＋</button>
</main>

<!-- add / edit person -->
<dialog id="dlg">
  <form id="pform" autocomplete="off">
    <h3 id="dTitle">Add a person</h3>
    <p class="ctx" id="dCtx"></p>
    <label>Name
      <input name="first" required placeholder="e.g. Anu">
      <span class="hint" id="nameHint"></span>
    </label>
    <label>Family name (surname)
      <input name="surname" list="surnameList" placeholder="e.g. Rao">
      <span class="hint">This is the family group they appear in.</span>
    </label>
    <div class="seg">
      <label><input type="radio" name="sex" value="f">♀ Female</label>
      <label><input type="radio" name="sex" value="m">♂ Male</label>
      <label><input type="radio" name="sex" value="" checked>Not set</label>
    </div>
    <div class="row2">
      <label>Born <input name="born" inputmode="numeric" placeholder="e.g. 1990"></label>
      <label>Died <input name="died" inputmode="numeric" placeholder="optional"></label>
    </div>
    <label id="coWrap">Other parent <select name="co"></select></label>
    <details>
      <summary>Avatar &amp; notes</summary>
      <div class="emojis" id="emojis"></div>
      <input type="hidden" name="emoji">
      <label>Notes <textarea name="notes" rows="3" placeholder="Stories, places, nicknames…"></textarea></label>
    </details>
    <div class="flash" id="flash"></div>
    <div class="dact">
      <button type="submit" class="btn" value="cancel" formnovalidate>Cancel</button>
      <button type="submit" class="btn" value="more" id="saveMore">Save &amp; add another</button>
      <button type="submit" class="btn primary" value="save">Save</button>
    </div>
  </form>
</dialog>

<!-- relationship finder -->
<dialog id="relDlg">
  <div class="dpad">
    <h3>🔗 How are we related?</h3>
    <label>First person <input id="relA" list="peopleList" placeholder="Start typing a name"></label>
    <label>Second person <input id="relB" list="peopleList" placeholder="Start typing a name"></label>
    <div id="relOut"></div>
    <div class="dact">
      <button class="btn" id="relClose">Close</button>
      <button class="btn primary" id="relShow" hidden>Show on tree</button>
    </div>
  </div>
</dialog>

<datalist id="surnameList"></datalist>
<datalist id="peopleList"></datalist>
<div id="toast"></div>

<script>
(() => {
'use strict';
const KEY = 'familyTree.v1';
const NW = 170, NH = 64, CG = 36, HG = 26, ROW = 150;
const PALETTE = ['#e0703a','#3a8fd6','#3fae6a','#b45fc8','#d6a23a','#d24f6e','#2fa7a0','#7b6bd6','#8c9a3a','#c7683f','#4f7fa8','#c45a9a'];
const EMOJI = ['👶','👧','👦','👩','👨','🧑','👵','👴','🧓','👩‍🦱','👨‍🦱','👩‍🦳','👨‍🦳','🧔','👱‍♀️','👱','🧕','👳','🌸','🌟','🦁','🌻','🎨','⚽'];
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const uid = () => Math.random().toString(36).slice(2, 9);
const yr = v => { const m = String(v || '').match(/\d{4}/); return m ? +m[0] : null; };
const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- data ----------
function sampleData() {
  const S = { people: {}, colors: {}, collapsed: {} };
  const add = (id, first, surname, sex, born, died) => S.people[id] = { id, first, surname, sex, born: String(born || ''), died: String(died || ''), emoji: '', notes: '', parents: [], spouses: [] };
  const wed = (a, b) => { S.people[a].spouses.push(b); S.people[b].spouses.push(a); };
  const kids = (ps, ...cs) => cs.forEach(c => S.people[c].parents = ps.slice());
  add('i1','Raman','Iyer','m',1908,1990); add('i2','Janaki','Iyer','f',1912,1999); wed('i1','i2');
  add('i3','Shankar','Iyer','m',1935,2015); add('i4','Usha','Iyer','f',1938); kids(['i1','i2'],'i3','i4');
  add('i5','Geeta','Iyer','f',1940); wed('i3','i5');
  add('i6','Lata','Iyer','f',1961); kids(['i3','i5'],'i6');
  add('m1','Dinesh','Mehta','m',1905,1980); add('j1','Sarla','Joshi','f',1910,1994); wed('m1','j1');
  add('m2','Mohan','Mehta','m',1934,2012); add('m3','Kamala','Mehta','f',1936); kids(['m1','j1'],'m2','m3');
  wed('m2','i4');
  add('m4','Arjun','Mehta','m',1960); add('m7','Nisha','Mehta','f',1964); kids(['m2','i4'],'m4','m7');
  add('r1','Venkat','Rao','m',1932,2008); wed('r1','m3');
  add('r2','Suresh','Rao','m',1958); add('r3','Padma','Rao','f',1962); kids(['r1','m3'],'r2','r3');
  wed('r2','i6');
  add('j2','Vikram','Joshi','m',1959); wed('r3','j2');
  add('j3','Riya','Joshi','f',1988); add('j4','Dev','Joshi','m',1992); kids(['j2','r3'],'j3','j4');
  add('r4','Anil','Rao','m',1985); add('r5','Meera','Rao','f',1990); kids(['r2','i6'],'r4','r5');
  add('d1','Joseph',"D'Souza",'m',1955); add('d2','Anne',"D'Souza",'f',1958); wed('d1','d2');
  add('d3','Maria',"D'Souza",'f',1987); kids(['d1','d2'],'d3'); wed('r4','d3');
  add('r6','Kiran','Rao','m',2015); add('r7','Leela','Rao','f',2019); kids(['r4','d3'],'r6','r7');
  S.people.r1.notes = 'Loved cricket and filter coffee. Taught every grandchild to ride a bike.';
  S.people.r7.emoji = '🌸';
  return S;
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.people) return normalize(s); } catch (e) {} return null; }
function normalize(s) {
  s.colors ||= {}; s.collapsed ||= {};
  for (const id in s.people) { const p = s.people[id]; p.id = id; p.parents ||= []; p.spouses ||= []; p.first ??= ''; p.surname ??= ''; }
  return s;
}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

let S = load() || sampleData();
const UI = { view: 'families', fams: new Set(), sel: null, t: { x: 40, y: 40, k: 1 }, pos: {}, L: null, hover: null, path: null, needFit: true, form: null };

const P = id => S.people[id];
const people = () => Object.values(S.people);
const fam = p => (p.surname || '').trim() || '—';
const kidsOf = id => people().filter(p => p.parents.includes(id)).map(p => p.id);
const sibsOf = id => { const p = P(id); if (!p.parents.length) return []; return people().filter(q => q.id !== id && q.parents.some(x => p.parents.includes(x))).map(q => q.id); };
function famColor(s) { if (!S.colors[s]) S.colors[s] = PALETTE[Object.keys(S.colors).length % PALETTE.length]; return S.colors[s]; }
function families() { const m = {}; people().forEach(p => (m[fam(p)] ||= []).push(p)); return m; }
function avatar(p) {
  if (p.emoji) return p.emoji;
  if (p.placeholder) return '❔';
  const b = yr(p.born), d = yr(p.died);
  const age = b ? (d || new Date().getFullYear()) - b : 35;
  const g = (f, m, n) => p.sex === 'f' ? f : p.sex === 'm' ? m : n;
  if (age < 4) return '👶';
  if (age < 15) return g('👧', '👦', '🧒');
  if (age >= 62) return g('👵', '👴', '🧓');
  return g('👩', '👨', '🧑');
}
function yearsTxt(p) {
  const b = yr(p.born) || p.born, d = yr(p.died) || p.died;
  if (b && d) return `${b} – ${d}`;
  if (b) return `b. ${b}`;
  if (d) return `d. ${d}`;
  return '';
}
const fullName = p => `${p.first || '?'} ${p.surname || ''}`.trim();

// ---------- toast & confetti ----------
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2300); }
function burst(x, y) {
  if (reduced) return;
  const bits = ['🎉','✨','🌱','💛','🌼','⭐'];
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div'); s.className = 'confetti'; s.textContent = bits[i % bits.length];
    s.style.left = x + 'px'; s.style.top = y + 'px'; document.body.appendChild(s);
    const a = Math.random() * Math.PI * 2, r = 60 + Math.random() * 80;
    s.animate([{ transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
               { transform: `translate(calc(-50% + ${Math.cos(a) * r}px), calc(-50% + ${Math.sin(a) * r - 40}px)) scale(1) rotate(${Math.random() * 120 - 60}deg)`, opacity: 0 }],
              { duration: 900 + Math.random() * 400, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => s.remove();
  }
}

// ---------- visibility & layout ----------
function visibleIds() {
  const B = new Set(people().filter(p => UI.fams.has(fam(p))).map(p => p.id));
  const V = new Set(B);
  B.forEach(id => { P(id).spouses.forEach(s => P(s) && V.add(s)); kidsOf(id).forEach(k => V.add(k)); });
  const hidden = new Set();
  for (const id of V) if (S.collapsed[id]) {
    const st = kidsOf(id);
    while (st.length) { const k = st.pop(); if (hidden.has(k)) continue; hidden.add(k); st.push(...kidsOf(k)); }
  }
  for (const h of [...hidden]) P(h).spouses.forEach(s => {
    if (!V.has(s) || hidden.has(s)) return;
    const anchored = P(s).parents.some(x => V.has(x) && !hidden.has(x));
    if (!anchored) hidden.add(s);
  });
  hidden.forEach(h => V.delete(h));
  return [...V];
}
function countDesc(id) { const seen = new Set(), st = kidsOf(id); while (st.length) { const k = st.pop(); if (seen.has(k)) continue; seen.add(k); st.push(...kidsOf(k)); } return seen.size; }

function layout(ids) {
  const set = new Set(ids);
  const vp = id => P(id).parents.filter(x => set.has(x));
  const vs = id => P(id).spouses.filter(x => set.has(x));
  const kidMap = {}; ids.forEach(id => kidMap[id] = []); ids.forEach(id => vp(id).forEach(p => kidMap[p].push(id)));
  const vc = id => kidMap[id];

  // generations
  const G = {}; ids.forEach(id => G[id] = 0);
  for (let it = 0; it < 80; it++) {
    let ch = false;
    for (const id of ids) {
      for (const p of vp(id)) if (G[id] < G[p] + 1) { G[id] = G[p] + 1; ch = true; }
      for (const s of vs(id)) { const m = Math.max(G[id], G[s]); if (G[id] !== m || G[s] !== m) { G[id] = G[s] = m; ch = true; } }
      if (!vp(id).length && vc(id).length) { const m = Math.min(...vc(id).map(k => G[k])) - 1; if (m > G[id]) { G[id] = m; ch = true; } }
    }
    if (!ch) break;
  }

  // couple units per generation
  const sorted = ids.slice().sort((a, b) => fam(P(a)).localeCompare(fam(P(b))) || (yr(P(a).born) || 9999) - (yr(P(b).born) || 9999));
  const unitOf = {}, rows = {};
  const mk = id => {
    const sp = vs(id).filter(s => G[s] === G[id] && !unitOf[s]);
    let members = [id, ...sp];
    if (sp.length >= 2) members = [sp[0], id, ...sp.slice(1)];
    const u = { members, x: 0 }; members.forEach(m => unitOf[m] = u); (rows[G[id]] ||= []).push(u);
  };
  sorted.filter(id => vs(id).filter(s => G[s] === G[id]).length >= 2).forEach(id => unitOf[id] || mk(id));
  sorted.forEach(id => unitOf[id] || mk(id));

  const uw = u => u.members.length * NW + (u.members.length - 1) * CG;
  const px = id => { const u = unitOf[id]; return u.x + u.members.indexOf(id) * (NW + CG) + NW / 2; };
  const gs = Object.keys(rows).map(Number).sort((a, b) => a - b);
  gs.forEach(g => { let x = 0; rows[g].forEach(u => { u.x = x; x += uw(u) + HG; }); });
  const sweep = (g, dir) => {
    const row = rows[g];
    const ks = row.map(u => { const rel = u.members.flatMap(dir < 0 ? vp : vc); return rel.length ? avg(rel.map(px)) : u.x + uw(u) / 2; });
    const order = row.map((u, i) => i).sort((a, b) => ks[a] - ks[b]);
    let right = -Infinity, shift = 0;
    order.forEach(i => { const u = row[i], w = uw(u); let l = ks[i] - w / 2; if (l < right + HG) l = right + HG; u.x = l; right = l + w; shift += ks[i] - (l + w / 2); });
    shift /= order.length;
    order.forEach(i => row[i].x += shift);
    rows[g] = order.map(i => row[i]);
  };
  for (let it = 0; it < 4; it++) { gs.forEach(g => sweep(g, -1)); [...gs].reverse().forEach(g => sweep(g, 1)); }

  const pos = {};
  ids.forEach(id => pos[id] = { x: px(id), y: gs.indexOf(G[id]) * ROW });
  const xs = ids.map(id => pos[id].x); const minX = Math.min(...xs);
  ids.forEach(id => pos[id].x -= minX);

  const couples = [], kids = [];
  ids.forEach(a => vs(a).forEach(b => { if (a < b && G[a] === G[b]) couples.push([a, b]); }));
  ids.forEach(c => { const ps = vp(c); if (ps.length) kids.push({ c, ps }); });

  const bands = gs.map((g, i) => {
    const ys = ids.filter(id => G[id] === g).map(id => yr(P(id).born)).filter(Boolean);
    const label = ys.length ? `${Math.floor(avg(ys) / 10) * 10}s` : `Generation ${i + 1}`;
    return { y: i * ROW, label };
  });
  return { pos, gen: G, couples, kids, bands, width: ids.length ? Math.max(...ids.map(id => pos[id].x)) + NW / 2 : 0 };
}

// ---------- families view ----------
function familyLinks() {
  const w = {};
  const bump = (a, b, v) => { if (a === b) return; const k = [a, b].sort().join('|'); w[k] = (w[k] || 0) + v; };
  people().forEach(p => {
    p.spouses.forEach(s => { const q = P(s); if (q && p.id < s) bump(fam(p), fam(q), 1); });
    p.parents.forEach(pa => { const q = P(pa); if (q) bump(fam(p), fam(q), .5); });
  });
  return w;
}

function renderFamilies() {
  const el = $('#familiesView');
  const fm = families();
  const names = Object.keys(fm).sort((a, b) => fm[b].length - fm[a].length || a.localeCompare(b));
  if (!names.length) {
    el.innerHTML = `<div class="empty"><div class="big">🌱</div><h1>Plant your family tree</h1>
      <p>Start with yourself — then add parents, partners and children with one tap each. Everyone is grouped by family name, so each line gets its own colour.</p>
      <p><button class="btn primary" data-a="first">＋ Add yourself</button> &nbsp; <button class="btn" data-a="sample">Try the example</button></p></div>`;
    return;
  }
  const all = layout(people().map(p => p.id));
  const genCount = new Set(Object.values(all.gen)).size;
  const links = familyLinks();

  // constellation (tiny force layout)
  const W = Math.max(300, Math.min(1100, el.clientWidth - 24)), H = W < 600 ? 320 : 430;
  const nodes = names.map((n, i) => {
    const a = (i / names.length) * Math.PI * 2 - Math.PI / 2, r = 30 + Math.sqrt(fm[n].length) * 12;
    return { n, r, x: W / 2 + (names.length > 1 ? Math.cos(a) * W * .28 : 0), y: H / 2 + (names.length > 1 ? Math.sin(a) * H * .28 : 0), vx: 0, vy: 0 };
  });
  const byName = Object.fromEntries(nodes.map(n => [n.n, n]));
  const L = Object.entries(links).map(([k, w]) => { const [a, b] = k.split('|'); return { a: byName[a], b: byName[b], w }; }).filter(l => l.a && l.b);
  for (let it = 0; it < 350; it++) {
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j]; let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      const min = (a.r + b.r + 34) * 1.5;
      if (d < min) { const f = (min - d) / d * .06; a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f; }
    }
    for (const l of L) {
      const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y, d = Math.hypot(dx, dy) || 1, t = l.a.r + l.b.r + 60;
      const f = (d - t) / d * .025; l.a.vx += dx * f; l.a.vy += dy * f; l.b.vx -= dx * f; l.b.vy -= dy * f;
    }
    for (const n of nodes) { n.vx += (W / 2 - n.x) * .004; n.vy += (H / 2 - n.y) * .006; n.x += n.vx; n.y += n.vy; n.vx *= .82; n.vy *= .82; }
  }
  const pad = 30;
  let x0 = Math.min(...nodes.map(n => n.x - n.r)) - pad, x1 = Math.max(...nodes.map(n => n.x + n.r)) + pad;
  let y0 = Math.min(...nodes.map(n => n.y - n.r)) - pad - 20, y1 = Math.max(...nodes.map(n => n.y + n.r)) + pad;
  const vw = Math.max(x1 - x0, W * .6), vh = Math.max(y1 - y0, H * .7);
  x0 -= (vw - (x1 - x0)) / 2; y0 -= (vh - (y1 - y0)) / 2;

  let svg = `<svg viewBox="${x0} ${y0} ${vw} ${vh}" style="height:${H}px" preserveAspectRatio="xMidYMid meet">`;
  for (const l of L) {
    svg += `<line class="flink" x1="${l.a.x}" y1="${l.a.y}" x2="${l.b.x}" y2="${l.b.y}" stroke-width="${2 + l.w * 1.6}"/>`;
    svg += `<text class="ring" x="${(l.a.x + l.b.x) / 2}" y="${(l.a.y + l.b.y) / 2 + 5}">💍</text>`;
  }
  nodes.forEach((n, i) => {
    const col = famColor(n.n), fs = clamp(n.r * .3, 13, 20);
    const avs = fm[n.n].slice().sort((a, b) => (yr(a.born) || 0) - (yr(b.born) || 0)).slice(0, 3).map(avatar).join('');
    svg += `<g class="bubble" data-fam="${esc(n.n)}" transform="translate(${n.x} ${n.y})"><g class="float" style="animation-delay:${-i * 1.3}s"><g class="grow">
      <circle r="${n.r}" fill="var(--panel)"/>
      <circle class="main" r="${n.r}" fill="${col}" fill-opacity=".15" stroke="${col}"/>
      <text y="${-n.r * .28}" style="font-size:${clamp(n.r * .26, 14, 22)}px">${avs}</text>
      <text class="fname" y="${n.r * .2}" style="font-size:${fs}px">${esc(trunc(n.n, 14))}</text>
      <text class="fcount" y="${n.r * .2 + 17}">${fm[n.n].length} ${fm[n.n].length === 1 ? 'person' : 'people'}</text>
    </g></g></g>`;
  });
  svg += '</svg>';

  const cards = names.map(n => {
    const list = fm[n], col = famColor(n);
    const ys = list.map(p => yr(p.born)).filter(Boolean);
    const gens = new Set(list.map(p => all.gen[p.id])).size;
    const linked = Object.keys(links).filter(k => k.split('|').includes(n)).map(k => k.split('|').find(x => x !== n));
    const avs = list.slice().sort((a, b) => (yr(a.born) || 0) - (yr(b.born) || 0)).slice(0, 8).map(avatar).join('');
    return `<div class="fcard" style="--c:${col}">
      <h3>${esc(n)}<span class="cnt">${list.length}</span></h3>
      <div class="avs">${avs}</div>
      <div class="meta">${ys.length ? `Born ${Math.min(...ys)} – ${Math.max(...ys)} · ` : ''}${gens} generation${gens === 1 ? '' : 's'}</div>
      ${linked.length ? `<div class="meta">💍 Linked to ${linked.map(esc).join(', ')}</div>` : ''}
      <div class="cact"><button class="btn primary" data-open="${esc(n)}">Open line →</button><button class="btn" data-addto="${esc(n)}">＋ Member</button></div>
    </div>`;
  }).join('');

  el.innerHTML = `<div class="wrap">
    <div class="hero"><div><h1>Your families</h1><div class="stats">${people().length} people · ${names.length} famil${names.length === 1 ? 'y' : 'ies'} · ${genCount} generations</div></div>
      <button class="btn primary" data-a="all">🌳 See everyone together</button></div>
    <div class="constellation"><div class="hint">Tap a family to open its line · 💍 = joined by marriage</div>${svg}</div>
    <div class="cards">${cards}</div></div>`;
}

$('#familiesView').addEventListener('click', e => {
  const t = e.target;
  const b = t.closest('.bubble'); if (b) return openFamily(b.dataset.fam);
  const o = t.closest('[data-open]'); if (o) return openFamily(o.dataset.open);
  const ad = t.closest('[data-addto]'); if (ad) return openForm('new', null, ad.dataset.addto);
  const a = t.closest('[data-a]'); if (!a) return;
  if (a.dataset.a === 'all') openAll();
  if (a.dataset.a === 'first') openForm('new', null, '', true);
  if (a.dataset.a === 'sample') { S = sampleData(); persist(); render(); toast('Example families loaded'); }
});

function openFamily(n) { UI.view = 'tree'; UI.fams = new Set([n]); UI.needFit = true; UI.path = null; render(); }
function openAll() { UI.view = 'tree'; UI.fams = new Set(Object.keys(families())); UI.needFit = true; render(); }

// ---------- tree view ----------
function renderChips() {
  const fm = families(); const names = Object.keys(fm).sort();
  const allOn = names.every(n => UI.fams.has(n));
  $('#chips').innerHTML = `<span class="lbl">Showing:</span><button class="chip all ${allOn ? 'on' : ''}" data-chip="*" style="--c:var(--accent)">Everyone</button>` +
    names.map(n => `<button class="chip ${UI.fams.has(n) ? 'on' : ''}" data-chip="${esc(n)}" style="--c:${famColor(n)}"><span class="dot"></span>${esc(n)} <span style="opacity:.6">${fm[n].length}</span></button>`).join('');
}
$('#chips').addEventListener('click', e => {
  const c = e.target.closest('[data-chip]'); if (!c) return;
  const n = c.dataset.chip, names = Object.keys(families());
  if (n === '*') UI.fams = names.every(x => UI.fams.has(x)) ? new Set([names[0]]) : new Set(names);
  else if (UI.fams.has(n)) { if (UI.fams.size > 1) UI.fams.delete(n); }
  else UI.fams.add(n);
  UI.needFit = true; renderTree();
});

function nodeSVG(p, set, isNew) {
  const f = fam(p), col = famColor(f), inFam = UI.fams.has(f);
  const kids = kidsOf(p.id), coll = !!S.collapsed[p.id];
  const sharer = p.spouses.find(s => {
    if (!set.has(s) || !kidsOf(s).some(k => kids.includes(k))) return false;
    const sIn = UI.fams.has(fam(P(s)));
    return (sIn && !inFam) || (sIn === inFam && s < p.id && !coll);
  });
  const showTog = kids.length && !sharer && (coll || kids.some(k => set.has(k)));
  const sub = p.placeholder ? 'tap to fill in' : yearsTxt(p);
  let jump = '';
  if (!inFam) {
    const label = '＋ ' + trunc(f, 12), w = label.length * 6.8 + 14;
    jump = `<g class="jump" data-fam="${esc(f)}" transform="translate(${NW - w - 10} -10)"><title>Show the ${esc(f)} family too</title><rect width="${w}" height="20" rx="10" fill="${col}"/><text x="${w / 2}" y="14">${esc(label)}</text></g>`;
  }
  return `<g class="node${inFam ? '' : ' in'}${UI.sel === p.id ? ' sel' : ''}${isNew ? ' pop' : ''}" data-id="${p.id}" style="--c:${col}">
    <rect class="shadow" x="1" y="4" width="${NW}" height="${NH}" rx="18"/>
    <rect class="card" width="${NW}" height="${NH}" rx="18"/>

  </g>`;
}

function renderTree() {
  const names = Object.keys(families());
  UI.fams = new Set([...UI.fams].filter(n => names.includes(n)));
  if (!UI.fams.size && names.length) UI.fams = new Set(names);
  renderChips();
  const ids = visibleIds(), set = new Set(ids);
  const L = layout(ids); UI.L = L;
  $('#treeEmpty').hidden = !!ids.length;
  $('#treeEmpty').innerHTML = ids.length ? '' : `<div><div style="font-size:48px">🌱</div><p>No one here yet.</p><button class="btn primary" id="emptyAdd">＋ Add a person</button></div>`;

  const w = L.width + NW;
  $('#bands').innerHTML = L.bands.map((b, i) => `<rect class="bandrect" x="${-NW - 60}" y="${b.y - 34}" width="${w + NW + 120}" height="${ROW - 4}" rx="24" ${i % 2 ? 'style="opacity:.4"' : ''}/><text class="bandlbl" x="${-NW / 2 - 40}" y="${b.y - 14}">${esc(b.label)}</text>`).join('');
  $('#nodes').innerHTML = ids.map(id => nodeSVG(P(id), set, !UI.pos[id])).join('');

  const from = {};
  for (const id of ids) {
    if (UI.pos[id]) { from[id] = { ...UI.pos[id] }; continue; }
    const p = P(id); const rel = [...p.parents, ...p.spouses, ...kidsOf(id)].find(r => UI.pos[r]);
    from[id] = rel ? { ...UI.pos[rel] } : { ...L.pos[id] };
  }
  if (UI.needFit) { UI.needFit = false; fit(L.pos); }
  tween(from, L.pos);
  const pp = $('#pathPill'); pp.hidden = !UI.path;
  if (UI.path) $('#pathTxt').textContent = UI.pathLabel || 'Showing a connection';
}

function tween(from, to, dur = 520) {
  cancelAnimationFrame(UI.raf);
  if (reduced) dur = 1;
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
    const cur = {};
    for (const id in to) { const a = from[id] || to[id]; cur[id] = { x: a.x + (to[id].x - a.x) * e, y: a.y + (to[id].y - a.y) * e }; }
    UI.pos = cur; applyPos(cur);
    if (t < 1) UI.raf = requestAnimationFrame(step);
  };
  UI.raf = requestAnimationFrame(step);
}

function applyPos(cur) {
  $$('#nodes .node').forEach(el => { const q = cur[el.dataset.id]; if (q) el.setAttribute('transform', `translate(${q.x - NW / 2} ${q.y})`); });
  $('#links').innerHTML = linksSVG(cur);
  applyHL();
}

function linksSVG(cur) {
  const L = UI.L; let h = '';
  for (const k of L.kids) {
    const c = cur[k.c]; if (!c) continue;
    const col = famColor(fam(P(k.c)));
    const ps = k.ps.filter(p => cur[p]);
    let origins;
    if (ps.length === 2 && P(ps[0]).spouses.includes(ps[1]) && L.gen[ps[0]] === L.gen[ps[1]]) origins = [{ x: (cur[ps[0]].x + cur[ps[1]].x) / 2, y: cur[ps[0]].y + NH / 2 }];
    else origins = ps.map(p => ({ x: cur[p].x, y: cur[p].y + NH }));
    for (const o of origins) {
      const my = (o.y + c.y) / 2 + 12;
      h += `<path class="link" data-c="${k.c}" data-p="${ps.join(' ')}" stroke="${col}" d="M${o.x} ${o.y} C${o.x} ${my} ${c.x} ${my} ${c.x} ${c.y}"/>`;
    }
  }
  for (const [a, b] of L.couples) {
    const A = cur[a], B = cur[b]; if (!A || !B) continue;
    const [l, r] = A.x < B.x ? [A, B] : [B, A]; const y = l.y + NH / 2;
    h += `<path class="couple" data-p="${a} ${b}" d="M${l.x + NW / 2} ${y} L${r.x - NW / 2} ${r.y + NH / 2}"/>`;
    if (Math.abs(r.x - l.x) < NW + CG + 6) h += `<text class="heart" x="${(l.x + r.x) / 2}" y="${y + 5}">♥</text>`;
  }
  return h;
}

function ancestorsOf(id) { const s = new Set(), st = [...P(id).parents]; while (st.length) { const x = st.pop(); if (s.has(x) || !P(x)) continue; s.add(x); st.push(...P(x).parents); } return s; }
function descendantsOf(id) { const s = new Set(), st = kidsOf(id); while (st.length) { const x = st.pop(); if (s.has(x)) continue; s.add(x); st.push(...kidsOf(x)); } return s; }
function lineage(id) { const s = new Set([id, ...ancestorsOf(id), ...descendantsOf(id), ...P(id).spouses]); return s; }

function applyHL() {
  const lit = UI.hover && P(UI.hover) ? lineage(UI.hover) : UI.path ? new Set(UI.path) : UI.sel && P(UI.sel) && UI.view === 'tree' ? lineage(UI.sel) : null;
  const svg = $('#tree'); svg.classList.toggle('hl', !!lit);
  if (!lit) return;
  $$('#nodes .node').forEach(el => el.classList.toggle('lit', lit.has(el.dataset.id)));
  $$('#links .link').forEach(el => el.classList.toggle('lit', lit.has(el.dataset.c) && el.dataset.p.split(' ').some(x => lit.has(x))));
  $$('#links .couple').forEach(el => el.classList.toggle('lit', el.dataset.p.split(' ').every(x => lit.has(x))));
}

// ---------- pan / zoom ----------
const svg = $('#tree');
function applyT() { $('#vp').setAttribute('transform', `translate(${UI.t.x} ${UI.t.y}) scale(${UI.t.k})`); }
function zoomAt(mx, my, f) { const k2 = clamp(UI.t.k * f, .15, 2.5); f = k2 / UI.t.k; UI.t.x = mx - (mx - UI.t.x) * f; UI.t.y = my - (my - UI.t.y) * f; UI.t.k = k2; }
function animT(to, dur = 450) {
  cancelAnimationFrame(UI.traf); const from = { ...UI.t }, t0 = performance.now(); if (reduced) dur = 1;
  const step = now => { const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
    UI.t = { x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e, k: from.k + (to.k - from.k) * e }; applyT();
    if (t < 1) UI.traf = requestAnimationFrame(step); };
  UI.traf = requestAnimationFrame(step);
}
function panelInset() { return $('#panel').classList.contains('open') && innerWidth > 700 ? 370 : 0; }
function fit(pos, anim = true) {
  const ids = Object.keys(pos); if (!ids.length) return;
  const r = svg.getBoundingClientRect(); if (!r.width) return;
  const xs = ids.map(i => pos[i].x), ys = ids.map(i => pos[i].y);
  const x0 = Math.min(...xs) - NW / 2 - 50, x1 = Math.max(...xs) + NW / 2 + 30, y0 = Math.min(...ys) - 50, y1 = Math.max(...ys) + NH + 60;
  const aw = r.width - panelInset(), ah = r.height - 60;
  const fitK = Math.min(aw / (x1 - x0), ah / (y1 - y0));
  const minK = innerWidth <= 700 ? .5 : .2;   // on phones never shrink past readable — pan instead
  const k = clamp(fitK, minK, 1.1);
  const to = { k, x: (aw - (x1 - x0) * k) / 2 - x0 * k, y: (ah - (y1 - y0) * k) / 2 - y0 * k + 10 };
  if ((y1 - y0) * k > ah) to.y = 20 - y0 * k;   // too tall: start at the oldest generation
  anim ? animT(to) : (UI.t = to, applyT());
}
function centerOn(id) {
  const q = UI.L?.pos[id]; if (!q) return; const r = svg.getBoundingClientRect();
  const k = Math.max(UI.t.k, .85), aw = r.width - panelInset();
  const vh = innerWidth <= 700 && $("#panel").classList.contains("open") ? Math.max(140, r.height - innerHeight * .55) : r.height;
  animT({ k, x: aw / 2 - q.x * k, y: vh / 2 - (q.y + NH / 2) * k });
}

const ptrs = new Map(); let down = null, lastClick = { id: null, t: 0 };
svg.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  if (ptrs.size === 1) down = { x: e.clientX, y: e.clientY, target: e.target, moved: false }; else if (down) down.moved = true;
  cancelAnimationFrame(UI.traf);
});
svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) {
    if (e.pointerType === 'mouse') { const n = e.target.closest?.('.node'); const id = n ? n.dataset.id : null; if (id !== UI.hover) { UI.hover = id; applyHL(); } }
    return;
  }
  const prev = ptrs.get(e.pointerId), cur = { x: e.clientX, y: e.clientY };
  if (ptrs.size === 1) {
    if (down && Math.hypot(cur.x - down.x, cur.y - down.y) > 5) down.moved = true;
    if (down?.moved) { UI.t.x += cur.x - prev.x; UI.t.y += cur.y - prev.y; applyT(); svg.classList.add('dragging'); }
  } else if (ptrs.size === 2) {
    const other = [...ptrs.entries()].find(([k]) => k !== e.pointerId)[1];
    const d0 = Math.hypot(prev.x - other.x, prev.y - other.y) || 1, d1 = Math.hypot(cur.x - other.x, cur.y - other.y) || 1;
    const r = svg.getBoundingClientRect();
    zoomAt((cur.x + other.x) / 2 - r.left, (cur.y + other.y) / 2 - r.top, d1 / d0);
    UI.t.x += (cur.x - prev.x) / 2; UI.t.y += (cur.y - prev.y) / 2; applyT();
  }
  ptrs.set(e.pointerId, cur);
});
const endPtr = e => {
  ptrs.delete(e.pointerId); svg.classList.remove('dragging');
  if (!ptrs.size) { if (down && !down.moved && e.type === 'pointerup') treeClick(down.target); down = null; }
};
svg.addEventListener('pointerup', endPtr); svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && UI.hover) { UI.hover = null; applyHL(); } });
svg.addEventListener('wheel', e => {
  e.preventDefault(); const r = svg.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015))); applyT();
}, { passive: false });

function treeClick(t) {
  const jump = t.closest('.jump'), tog = t.closest('.tog'), node = t.closest('.node');
  if (jump) { const f = jump.dataset.fam; UI.fams.add(f); renderTree(); toast(`✨ The ${f} family joined the view`); return; }
  if (tog && node) { const id = node.dataset.id; S.collapsed[id] = !S.collapsed[id]; persist(); renderTree(); return; }
  if (node) {
    const id = node.dataset.id, now = Date.now();
    if (lastClick.id === id && now - lastClick.t < 380) { openForm('edit', id); lastClick = { id: null, t: 0 }; return; }
    lastClick = { id, t: now };
    select(id, innerWidth <= 700); return;
  }
  if (UI.sel || UI.path) { UI.sel = null; UI.path = null; $('#pathPill').hidden = true; $$('#nodes .node.sel').forEach(n => n.classList.remove('sel')); applyHL(); renderPanel(); }
}

function select(id, center) {

}

$('#zOut').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, .8); applyT(); };

// ---------- add / edit form ----------
const dlg = $('#dlg'), form = $('#pform');
function setEmoji(v) { form.emoji.value = v; $$('#emojis button').forEach(b => b.classList.toggle('on', b.dataset.e === v)); }
$('#emojis').innerHTML = `<button type="button" class="auto" data-e="">Auto</button>` + EMOJI.map(e => `<button type="button" data-e="${e}">${e}</button>`).join('');
$('#emojis').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setEmoji(b.dataset.e); });

function openForm(mode, of, presetSurname = '', first = false) {
  form.reset(); setEmoji(''); $('#flash').textContent = '';
  UI.form = { mode, of, first };
  const o = of && P(of);
  const inView = s => UI.view === 'tree' && UI.fams.has(s);
  let title = 'Add a person', ctx = '', surname = presetSurname, hint = 'Tip: add several at once — “Anu 1990, Ravi 1993”.', sex = '';
  const coWrap = $('#coWrap'); coWrap.hidden = true;
  if (mode === 'new' && first) { title = '🌱 Who comes first?'; ctx = 'Start with yourself — you can add everyone else from your card.'; hint = 'Your first name (or full name).'; }
  if (mode === 'edit') { title = `Edit ${o.placeholder ? 'person' : o.first}`; hint = ''; }
  if (mode === 'child') {
    title = `👶 Add a child`; ctx = `Child of ${fullName(o)}`;
    const blood = !inView(fam(o)) && o.spouses.map(P).find(s => s && inView(fam(s)));
    surname = blood ? fam(blood) : (o.surname || '');
    if (o.spouses.length) {

    }
  }
  if (mode === 'spouse') { title = '💍 Add a partner'; ctx = `Partner of ${fullName(o)}`; surname = ''; hint = 'Type their family name below — they can come from a different family.'; sex = o.sex === 'f' ? 'm' : o.sex === 'm' ? 'f' : ''; }
  if (mode === 'parent') { title = '🧓 Add a parent'; ctx = `Parent of ${fullName(o)}`; surname = o.surname || ''; hint = '';
    const other = o.parents.map(P).find(Boolean); if (other) { sex = other.sex === 'f' ? 'm' : other.sex === 'm' ? 'f' : ''; ctx += ` — will be paired with ${other.first}`; } }

function parseTokens(raw, surname, multi) {
  const parts = multi ? raw.split(/\s*[,\n;]\s*/) : [raw.replace(/\s*[,\n;]\s*/g, ' ')];
  return parts.map(s => s.trim()).filter(Boolean).map(t => {
    let born = '', sn = surname;
    const m = t.match(/^(.*?)[\s(]+(\d{4})\)?$/); if (m) { t = m[1].trim(); born = m[2]; }
    if (sn && t.toLowerCase().endsWith(' ' + sn.toLowerCase())) t = t.slice(0, -sn.length).trim();
    else if (!sn && t.includes(' ')) { const w = t.split(/\s+/); sn = w.pop(); t = w.join(' '); }
    return { first: t, born, surname: sn };
  });
}
function wed(a, b) { if (!P(a).spouses.includes(b)) P(a).spouses.push(b); if (!P(b).spouses.includes(a)) P(b).spouses.push(a); }
function create(d) { const id = uid(); S.people[id] = { id, first: d.first, surname: d.surname, sex: d.sex, born: d.born, died: d.died, emoji: d.emoji, notes: d.notes, parents: [], spouses: [] }; famColor(fam(S.people[id])); return id; }

form.addEventListener('submit', e => {
  e.preventDefault();
  const act = e.submitter?.value || 'save';
  if (act === 'cancel') { dlg.close(); return; }
  const { mode, of, first } = UI.form;
  const base = { surname: form.surname.value.trim(), sex: form.sex.value, born: form.born.value.trim(), died: form.died.value.trim(), emoji: form.emoji.value, notes: form.notes.value.trim() };
  const multi = ['child', 'sibling', 'new'].includes(mode) && !first;
  const toks = parseTokens(form.first.value, base.surname, multi);
  if (!toks.length) { form.first.focus(); return; }
  const made = [];
  if (mode === 'edit') {
    const p = P(of), t = toks[0];
    Object.assign(p, base, { first: t.first, surname: t.surname, born: base.born || t.born }); delete p.placeholder;
    famColor(fam(p));
  } else {
    const o = of && P(of);
    if (mode === 'sibling' && !o.parents.length) {
      const ph = create({ first: 'Unknown', surname: o.surname, sex: '', born: '', died: '', emoji: '', notes: '' });
      P(ph).placeholder = true; o.parents = [ph];
    }
    for (const t of toks) {
      const id = create({ ...base, first: t.first, surname: t.surname, born: base.born || t.born });
      if (mode === 'child') P(id).parents = [of, form.co.value].filter(Boolean);
      if (mode === 'spouse') wed(of, id);
      if (mode === 'sibling') P(id).parents = o.parents.slice();
      if (mode === 'parent') {
        const other = o.parents.find(P);
        o.parents.push(id);
        if (other) wed(other, id);
        sibsOf(of).forEach(s => { const q = P(s); if (q.parents.length === 1 && q.parents[0] === other) q.parents.push(id); });
      }
      made.push(id);
    }
  }
  persist();
  const names = made.map(id => P(id).first).join(', ');
  if (mode === 'new') {
    UI.view = 'tree'; made.forEach(id => UI.fams.add(fam(P(id))));
    UI.sel = made[0];
    if (first) UI.needFit = true;
  }
  render();
  if (made.length) {
    setTimeout(() => {
      const q = UI.L?.pos[made[0]], r = svg.getBoundingClientRect();
      if (q && r.width) burst(r.left + UI.t.x + q.x * UI.t.k, r.top + UI.t.y + (q.y + NH / 2) * UI.t.k);
    }, 560);
    if (mode !== 'new') setTimeout(() => centerOn(made[0]), 80);
  }
  if (act === 'more') {
    ['first', 'born', 'died', 'notes'].forEach(n => form[n].value = ''); setEmoji('');
    $('#flash').textContent = `✓ Added ${names} — keep going!`;
    form.first.focus();
  } else {
    dlg.close();
    toast(mode === 'edit' ? '✓ Saved' : first ? `Welcome, ${names}! Now add your family from your card 👉` : `🎉 Added ${names}`);
  }
});

// ---------- relationships ----------
function upDist(id) { const d = new Map([[id, 0]]), q = [id]; while (q.length) { const x = q.shift(); for (const p of P(x).parents) if (P(p) && !d.has(p)) { d.set(p, d.get(x) + 1); q.push(p); } } return d; }
function term(a, b) { // a is b's ___
  const A = upDist(a), B = upDist(b); let best = null;
  for (const [x, da] of A) if (B.has(x)) { const db = B.get(x); if (!best || da + db < best.da + best.db) best = { da, db }; }
  if (!best) return null;
  const { da, db } = best, s = P(a).sex, g = (f, m, n) => s === 'f' ? f : s === 'm' ? m : n;
  const gr = n => n <= 0 ? '' : n === 1 ? 'great-' : n === 2 ? 'great-great-' : `${n}× great-`;
  if (!da && !db) return 'the same person';
  if (!da) return db === 1 ? g('mother', 'father', 'parent') : gr(db - 2) + 'grand' + g('mother', 'father', 'parent');
  if (!db) return da === 1 ? g('daughter', 'son', 'child') : gr(da - 2) + 'grand' + g('daughter', 'son', 'child');
  if (da === 1 && db === 1) return g('sister', 'brother', 'sibling');
  if (da === 1) return gr(db - 2) + g('aunt', 'uncle', 'aunt or uncle');
  if (db === 1) return gr(da - 2) + g('niece', 'nephew', 'niece or nephew');
  const deg = Math.min(da, db) - 1, rem = Math.abs(da - db);
  const ord = ['', 'first', 'second', 'third', 'fourth', 'fifth', 'sixth'][deg] || deg + 'th';
  return `${ord} cousin${rem ? rem === 1 ? ' once removed' : rem === 2 ? ' twice removed' : ` ${rem}× removed` : ''}`;
}
function relation(a, b) {
  const pa = P(a), pb = P(b), g = (p, f, m, n) => p.sex === 'f' ? f : p.sex === 'm' ? m : n;
  if (a === b) return 'the same person';
  if (pa.spouses.includes(b)) return g(pa, 'wife', 'husband', 'partner');
  const t = term(a, b); if (t) return t;
  for (const s of pb.spouses) { const x = P(s) && term(a, s); if (!x) continue;   // a is b's spouse's x
    if (/^(mother|father|parent)$/.test(x)) return x + '-in-law';
    if (/^(sister|brother|sibling)$/.test(x)) return x + '-in-law';
    if (/(mother|father|parent)$/.test(x)) return x + '-in-law';
    return `${g(pb, 'husband', 'wife', 'partner')}'s ${x}`; }
  for (const s of pa.spouses) { const x = P(s) && term(s, b); if (!x) continue;   // a is spouse of b's x
    if (/(daughter|son|child)$/.test(x)) return x.replace(/(daughter|son|child)$/, g(pa, 'daughter', 'son', 'child')) + '-in-law';
    if (/^(sister|brother|sibling)$/.test(x)) return g(pa, 'sister', 'brother', 'sibling') + '-in-law';
    if (/(aunt|uncle)/.test(x)) return g(pa, 'aunt', 'uncle', 'aunt or uncle') + ' (by marriage)';
    return `${x}'s ${g(pa, 'wife', 'husband', 'partner')}`; }
  return null;
}
function pathBetween(a, b) {
  const prev = { [a]: null }, q = [a];
  while (q.length) { const x = q.shift(); if (x === b) break;
    for (const n of [...P(x).parents, ...kidsOf(x), ...P(x).spouses]) if (P(n) && !(n in prev)) { prev[n] = x; q.push(n); } }
  if (!(b in prev)) return null;
  const path = []; for (let c = b; c != null; c = prev[c]) path.unshift(c); return path;
}
let labelMap = {};
const labelOf = id => { const p = P(id); return `${fullName(p)}${yr(p.born) ? ` (${yr(p.born)})` : ''}`; };
function refreshLists() {
  $('#surnameList').innerHTML = Object.keys(families()).filter(n => n !== '—').map(n => `<option value="${esc(n)}">`).join('');
  labelMap = {}; const seen = {};
  people().filter(p => !p.placeholder).forEach(p => { let l = labelOf(p.id); if (seen[l]) l += ` #${p.id.slice(0, 3)}`; seen[l] = 1; labelMap[l] = p.id; });
  $('#peopleList').innerHTML = Object.keys(labelMap).sort().map(l => `<option value="${esc(l)}">`).join('');
}
const relDlg = $('#relDlg');
function openRel(a) {
  refreshLists();
  $('#relA').value = a ? (Object.keys(labelMap).find(l => labelMap[l] === a) || '') : '';
  $('#relB').value = ''; $('#relOut').innerHTML = ''; $('#relShow').hidden = true;
  relDlg.showModal(); setTimeout(() => (a ? $('#relB') : $('#relA')).focus(), 40);
}
function findId(v) { if (labelMap[v]) return labelMap[v]; const lv = v.trim().toLowerCase(); if (!lv) return null; const m = Object.keys(labelMap).filter(l => l.toLowerCase().startsWith(lv)); return m.length === 1 ? labelMap[m[0]] : null; }
function updateRel() {
  const a = findId($('#relA').value), b = findId($('#relB').value), out = $('#relOut');
  $('#relShow').hidden = true;
  if (!a || !b) { out.innerHTML = ''; return; }
  const path = pathBetween(a, b), r = relation(a, b), A = P(a), B = P(b);
  const chain = path ? `<div class="chain">${path.map(id => `<span class="pchip" style="--c:${famColor(fam(P(id)))}">${avatar(P(id))} ${esc(P(id).first)}</span>`).join('<i>→</i>')}</div>` : '';
  let line;
  if (r) line = `<b>${esc(A.first)}</b> is <b>${esc(B.first)}</b>'s <em>${esc(r)}</em>`;
  else if (path) line = `<b>${esc(A.first)}</b> and <b>${esc(B.first)}</b> are <em>connected through family</em> — ${path.length - 1} steps apart`;
  else line = `No connection yet between <b>${esc(A.first)}</b> and <b>${esc(B.first)}</b> 🤔`;
  out.innerHTML = `<div class="relbig">${line}</div>${chain}`;
  if (path && path.length > 1) { $('#relShow').hidden = false; UI.relPending = { path, label: r ? `${A.first} is ${B.first}'s ${r}` : `${A.first} ↔ ${B.first}` }; }
}
$('#relA').addEventListener('input', updateRel); $('#relB').addEventListener('input', updateRel);
$('#relClose').onclick = () => relDlg.close();
$('#relShow').onclick = () => {
  const { path, label } = UI.relPending; relDlg.close();
  UI.view = 'tree'; path.forEach(id => UI.fams.add(fam(P(id))));
  UI.path = path; UI.pathLabel = '🔗 ' + label; UI.sel = null; UI.needFit = true; render();
};
$('#relBtn').onclick = () => openRel(UI.sel);

// ---------- search ----------
const q = $('#q'), results = $('#results'); let hits = [], hi = 0;
function doSearch() {
  const v = q.value.trim().toLowerCase();
  if (!v) { results.hidden = true; return; }
  hits = people().filter(p => !p.placeholder && fullName(p).toLowerCase().includes(v)).slice(0, 8); hi = 0;
  results.innerHTML = hits.length ? hits.map((p, i) => `<button data-hit="${p.id}" class="${i === hi ? 'on' : ''}"><span style="font-size:20px">${avatar(p)}</span>${esc(fullName(p))}<small>${esc(yearsTxt(p))}</small></button>`).join('')
    : `<div style="padding:10px;color:var(--muted)">No one called “${esc(q.value)}” yet. <button class="btn" data-newname style="margin-top:6px">＋ Add them</button></div>`;
  results.hidden = false;
}
function goHit(id) { q.value = ''; results.hidden = true; q.blur(); select(id, true); }
q.addEventListener('input', doSearch);
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); hi = clamp(hi + (e.key === 'ArrowDown' ? 1 : -1), 0, hits.length - 1); $$('#results [data-hit]').forEach((b, i) => b.classList.toggle('on', i === hi)); }
  if (e.key === 'Enter' && hits[hi]) goHit(hits[hi].id);
  if (e.key === 'Escape') { q.value = ''; results.hidden = true; q.blur(); }
});
results.addEventListener('click', e => {
  const h = e.target.closest('[data-hit]'); if (h) return goHit(h.dataset.hit);
  if (e.target.closest('[data-newname]')) { const v = q.value; q.value = ''; results.hidden = true; openForm('new'); form.first.value = v; }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search')) results.hidden = true;
  if (!e.target.closest('#menu') && !e.target.closest('#menuBtn')) $('#menu').hidden = true;
});

// ---------- header, menu, import/export ----------
$('#tabFam').onclick = () => { UI.view = 'families'; render(); };
$('#tabTree').onclick = () => { if (UI.view !== 'tree') { UI.view = 'tree'; if (!UI.fams.size) UI.fams = new Set(Object.keys(families())); UI.needFit = true; } render(); };
$('#fab').onclick = () => {
  if (UI.view === 'tree' && UI.sel) return openForm('child', UI.sel);
  $('#addBtn').click();
};
// swipe the person sheet down to close (phones)
(() => {
  const pn = $('#panel'); let y0 = null, dy = 0;
  pn.addEventListener('pointerdown', e => { if (!e.target.closest('.grab') && !e.target.closest('.phead')) return; y0 = e.clientY; dy = 0; pn.style.transition = 'none'; try { pn.setPointerCapture(e.pointerId); } catch (_) {} });
  pn.addEventListener('pointermove', e => { if (y0 == null || innerWidth > 700) return; dy = Math.max(0, e.clientY - y0); pn.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 == null) return; y0 = null; pn.style.transition = ''; pn.style.transform = '';
    if (dy > 80) { UI.sel = null; $$('#nodes .node.sel').forEach(n => n.classList.remove('sel')); renderPanel(); } };
  pn.addEventListener('pointerup', end); pn.addEventListener('pointercancel', end);
})();
$('#addBtn').onclick = () => {
  if (!people().length) return openForm('new', null, '', true);
  openForm('new', null, UI.view === 'tree' && UI.fams.size === 1 ? [...UI.fams][0] : '');
};
$('#menuBtn').onclick = () => { $('#menu').hidden = !$('#menu').hidden; UI.blankArmed = false; $('#blankBtn').textContent = '🧹 Start a blank tree'; };
$('#menu').addEventListener('click', e => {
  const b = e.target.closest('[data-m]'); if (!b) return;
  const m = b.dataset.m;
  if (m === 'rel') { $('#menu').hidden = true; openRel(UI.sel); }
  if (m === 'export') {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `family-tree-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    $('#menu').hidden = true; toast('⬇️ Backup saved to your downloads');
  }
  if (m === 'sample') { S = sampleData(); persist(); UI.sel = null; UI.pos = {}; UI.view = 'families'; $('#menu').hidden = true; render(); toast('🧪 Example families loaded'); }
  if (m === 'blank') {
    if (!UI.blankArmed) { UI.blankArmed = true; b.textContent = '⚠️ Tap again — this erases everyone'; return; }
    S = { people: {}, colors: {}, collapsed: {} }; persist(); UI.sel = null; UI.pos = {}; UI.fams = new Set(); UI.view = 'families'; $('#menu').hidden = true; render(); toast('Blank tree — start with yourself 🌱');
  }
});
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { const d = JSON.parse(rd.result); if (!d || typeof d.people !== 'object') throw 0; S = normalize(d); persist(); UI.sel = null; UI.pos = {}; UI.view = 'families'; render(); toast(`⬆️ Loaded ${people().length} people`); }
    catch (_) { toast('That file doesn’t look like a family tree backup'); }
  };
  rd.readAsText(f); e.target.value = ''; $('#menu').hidden = true;
});

document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select') || dlg.open || relDlg.open) return;
  if (e.key === '/') { e.preventDefault(); q.focus(); }
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); $('#addBtn').click(); }
  if (e.key === 'Escape' && UI.sel) { UI.sel = null; renderPanel(); $$('#nodes .node.sel').forEach(n => n.classList.remove('sel')); }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => UI.view === 'families' && renderFamilies(), 150); });

// ---------- root ----------
function render() {
  $('#tabFam').classList.toggle('on', UI.view === 'families');
  $('#tabTree').classList.toggle('on', UI.view === 'tree');
  $('#familiesView').hidden = UI.view !== 'families';
  $('#treeView').hidden = UI.view !== 'tree';
  refreshLists();
  if (UI.view === 'families') renderFamilies(); else renderTree();
  renderPanel();
  persist();
}
applyT();
render();
})();
</script>
</body>
